<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base App Tile (Squircle) -->
  <rect width="512" height="512" rx="128" fill="url(#grad)"/>

  <!-- Subtle Inner Engineering Grid -->
  <path d="M96 256h320M256 96v320" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- Outer Metrology Reticle Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"/>

  <!-- Optical Precision Brackets -->
  <path d="M196 116h-60v60" fill="none" stroke="#5EEAD4" stroke-width="12" stroke-linecap="round"/>
  <path d="M316 116h60v60" fill="none" stroke="#5EEAD4" stroke-width="12" stroke-linecap="round"/>
  <path d="M196 396h-60v-60" fill="none" stroke="#5EEAD4" stroke-width="12" stroke-linecap="round"/>
  <path d="M316 396h60v-60" fill="none" stroke="#5EEAD4" stroke-width="12" stroke-linecap="round"/>

  <!-- Inner Diagnostic Scanner Ring -->
  <circle cx="256" cy="256" r="100" fill="#042F2E" fill-opacity="0.4" stroke="#FFFFFF" stroke-width="8"/>

  <!-- Crosshair Ticks -->
  <line x1="256" y1="126" x2="256" y2="176" stroke="#5EEAD4" stroke-width="8" stroke-linecap="round"/>
  <line x1="256" y1="336" x2="256" y2="386" stroke="#5EEAD4" stroke-width="8" stroke-linecap="round"/>
  <line x1="126" y1="256" x2="176" y2="256" stroke="#5EEAD4" stroke-width="8" stroke-linecap="round"/>
  <line x1="336" y1="256" x2="386" y2="256" stroke="#5EEAD4" stroke-width="8" stroke-linecap="round"/>

  <!-- Center Focal Core Pulse -->
  <circle cx="256" cy="256" r="38" fill="#5EEAD4" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="16" fill="#FFFFFF"/>
</svg>
